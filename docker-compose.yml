version: '3.8'

services:
  video2doc-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video2doc-app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - APP_ENV=production
    volumes:
      - ./storage:/app/storage
      - ./output:/app/output
      - ./fixtures:/app/fixtures
    restart: unless-stopped
